name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No `pip install`: this job keeps Tuxchange free of required dependencies.
      - name: Everything compiles
        run: python -m compileall -q tuxchange gui tools

      # These run with no keys and no corpus, as on a fresh clone.
      - name: Daemon self-test
        run: python tuxchange/sp_relay.py selftest

      - name: Link self-test
        run: python tuxchange/sp_link.py --selftest

      - name: Full handshake simulation
        run: python tuxchange/sp_link.py --simulate

      - name: Remaining module self-tests
        run: |
          set -e
          python tuxchange/sp_build.py --selftest
          python tuxchange/sp_mii.py --selftest
          python tuxchange/sp_cecstore.py --selftest
          python tuxchange/sp_store.py --selftest
          python tuxchange/sp_smdh.py --selftest
          python tuxchange/sp_yysession.py --selftest
          python tuxchange/sp_savefs.py --selftest
          python tuxchange/sp_cecexport.py --selftest
          python tuxchange/sp_probe_tx.py --selftest
          python tuxchange/sp_aes.py --selftest
          python tuxchange/sp_identity.py selftest
          python tools/macfilter_decode.py --selftest

      - name: No key material has crept into the tree
        run: ./.github/scripts/keyscan.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: |
          set -e
          for f in scripts/tuxchange scripts/tuxchange-link scripts/tuxchange-probe \
                   scripts/sp_monitor.sh install/install.sh; do
            bash -n "$f" && echo "ok  $f"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
